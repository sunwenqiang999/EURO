<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#4874CB" stroke-width="2.5"/></marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#30C0B4" stroke-width="2.5"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#17345C">
    <rect x="64" y="58" width="8" height="54" rx="4" fill="#4874CB"/>
    <text x="92" y="99" font-size="42" font-weight="700">逆向归纳：从客户端响应到均衡策略</text>
    <text x="92" y="145" font-size="26" fill="#61728A">执行时先激励、后响应；求解时先响应、后激励</text>

    <rect x="64" y="183" width="1472" height="257" rx="24" fill="#F1F5FC"/>
    <text x="94" y="230" font-size="30" font-weight="700">执行顺序</text>
    <text x="94" y="268" font-size="23" fill="#61728A">领导者先行动</text>
    <g stroke="#4874CB" stroke-width="3" fill="#FFFFFF">
      <rect x="367" y="252" width="91" height="37" rx="7"/>
      <rect x="367" y="299" width="91" height="37" rx="7"/>
      <rect x="367" y="346" width="91" height="37" rx="7"/>
      <path d="M378 270 H403 M378 317 H403 M378 364 H403"/>
      <circle cx="441" cy="270" r="3" fill="#30C0B4" stroke="none"/>
      <circle cx="441" cy="317" r="3" fill="#30C0B4" stroke="none"/>
      <circle cx="441" cy="364" r="3" fill="#30C0B4" stroke="none"/>
    </g>
    <text x="496" y="285" font-size="32" font-weight="700">服务器</text>
    <text x="496" y="333" font-size="30">先确定奖励 p</text>
    <path d="M772 316 H951" stroke="#4874CB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <text x="861" y="279" font-size="23" text-anchor="middle" fill="#4874CB">发布激励</text>
    <g stroke="#4874CB" stroke-width="3" fill="#FFFFFF">
      <rect x="1001" y="255" width="59" height="112" rx="10"/>
      <path d="M1018 268 H1043 M1019 353 H1042"/>
      <rect x="1081" y="271" width="104" height="72" rx="5"/>
      <path d="M1070 354 H1196 L1185 367 H1081 Z"/>
      <rect x="1020" y="293" width="22" height="30" rx="3" fill="#F1F5FC"/>
      <path d="M1099 307 H1167 M1099 320 H1143" stroke="#30C0B4"/>
    </g>
    <text x="1230" y="285" font-size="32" font-weight="700">客户端</text>
    <text x="1230" y="333" font-size="30">后选择频率 δ</text>

    <text x="64" y="500" font-size="30" font-weight="700">求解顺序</text>
    <text x="255" y="500" font-size="25" fill="#61728A">沿决策依赖反向求解</text>
    <path d="M396 602 H451 M755 602 H810 M1114 602 H1169" stroke="#30C0B4" stroke-width="3" marker-end="url(#tealArrow)" fill="none"/>
    <rect x="64" y="535" width="332" height="137" rx="18" fill="#F1F5FC"/>
    <rect x="455" y="535" width="300" height="137" rx="18" fill="#F1F5FC"/>
    <rect x="814" y="535" width="300" height="137" rx="18" fill="#F1F5FC"/>
    <rect x="1173" y="535" width="363" height="137" rx="18" fill="#17345C"/>
    <circle cx="98" cy="568" r="16" fill="#4874CB"/><text x="98" y="576" font-size="22" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="489" cy="568" r="16" fill="#4874CB"/><text x="489" y="576" font-size="22" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="848" cy="568" r="16" fill="#4874CB"/><text x="848" y="576" font-size="22" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="1207" cy="568" r="16" fill="#30C0B4"/><text x="1207" y="576" font-size="22" fill="#17345C" text-anchor="middle">4</text>
    <text x="230" y="606" font-size="28" font-weight="600" text-anchor="middle">客户端最优响应</text>
    <text x="230" y="646" font-size="30" fill="#4874CB" text-anchor="middle">δ*(p)</text>
    <text x="605" y="606" font-size="28" font-weight="600" text-anchor="middle">代入服务器目标</text>
    <text x="605" y="645" font-size="23" fill="#61728A" text-anchor="middle">将响应纳入奖励决策</text>
    <text x="964" y="606" font-size="28" font-weight="600" text-anchor="middle">预算下优化奖励</text>
    <text x="964" y="646" font-size="30" fill="#4874CB" text-anchor="middle">p*</text>
    <text x="1354" y="606" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">得到均衡策略</text>
    <text x="1354" y="646" font-size="30" fill="#FFFFFF" text-anchor="middle">(p*, δ*)</text>

    <path d="M125 820 V722 M125 820 H437" stroke="#8C9CB1" stroke-width="2" fill="none"/>
    <path d="M145 805 Q202 742 259 742 Q316 742 407 815" stroke="#4874CB" stroke-width="4" fill="none"/>
    <path d="M259 742 V820" stroke="#EE822F" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="259" cy="742" r="7" fill="#EE822F"/>
    <text x="100" y="753" font-size="22" text-anchor="end">效用</text>
    <text x="445" y="850" font-size="22" text-anchor="end">CPU 频率 δ</text>
    <text x="277" y="725" font-size="22" fill="#EE822F">最优点</text>
    <text x="125" y="884" font-size="22" fill="#61728A">固定奖励下的凹效用曲线（示意）</text>
    <rect x="560" y="716" width="976" height="127" rx="18" fill="#F1F5FC"/>
    <path d="M590 748 H590 M590 748 V811" stroke="#30C0B4" stroke-width="5" stroke-linecap="round"/>
    <text x="620" y="761" font-size="28" font-weight="600">核心逻辑：先理解响应，再设计激励</text>
    <text x="620" y="804" font-size="24" fill="#61728A">客户端响应约束服务器决策；预算约束奖励的可行范围。</text>
  </g>
</svg>
