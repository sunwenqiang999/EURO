<text x="134" y="1082" font-size="35" font-weight="500">表中四组代表性目标下，GBSFL 较对应最优基线减少累计耗时 30.1%–43.3%。</text>
<text x="100" y="1187" font-size="27" >注：各方法共用既有准确率轨迹；耗时累计至首次达到目标精度的轮次（包含该轮）。</text>
<text x="100" y="1231" font-size="27" >耗时降低 =（最优基线耗时 − GBSFL 耗时）/ 最优基线耗时；FedAvg 为均匀预算基线。</text>
<text x="100" y="1275" font-size="25" style="fill:#64758E">数据来源：现有整体对比实验的逐轮记录；单次模拟结果，非实际程序运行耗时。</text>
