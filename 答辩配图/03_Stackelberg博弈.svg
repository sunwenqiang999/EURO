<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#4874CB"/></marker>
    <marker id="orange-arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#EE822F"/></marker>
    <g id="cpu" fill="white" stroke="#17345C" stroke-width="3"><rect x="-27" y="-27" width="54" height="54" rx="7"/><rect x="-14" y="-14" width="28" height="28" rx="3" stroke="#4874CB"/><path d="M-16-38 V-27 M0-38 V-27 M16-38 V-27 M-16 27 V38 M0 27 V38 M16 27 V38 M-38-16 H-27 M-38 0 H-27 M-38 16 H-27 M27-16 H38 M27 0 H38 M27 16 H38"/></g>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <rect x="64" y="62" width="8" height="65" rx="4" fill="#4874CB"/>
  <text x="96" y="103" font-size="44" font-weight="700" fill="#17345C">斯塔克尔伯格博弈：先定奖励，再选频率</text>
  <text x="96" y="153" font-size="27" fill="#4874CB">服务器先行动，客户端观察奖励后各自决策，随后执行本地训练</text>

  <path d="M94 224 H1493" stroke="#4874CB" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <circle cx="245" cy="224" r="13" fill="#4874CB"/>
  <circle cx="1050" cy="224" r="13" fill="#30C0B4"/>
  <rect x="90" y="244" width="480" height="427" rx="26" fill="#F1F5FC"/>
  <rect x="829" y="244" width="681" height="427" rx="26" fill="#F1F5FC"/>
  <text x="130" y="294" font-size="32" font-weight="700" fill="#4874CB">阶段一 · 服务器领导者</text>
  <text x="869" y="294" font-size="32" font-weight="700" fill="#17345C">阶段二 · 客户端追随者</text>

  <g fill="white" stroke="#17345C" stroke-width="4"><rect x="265" y="330" width="130" height="43" rx="8"/><rect x="265" y="384" width="130" height="43" rx="8"/></g>
  <g fill="#30C0B4"><circle cx="284" cy="351" r="5"/><circle cx="284" cy="405" r="5"/></g>
  <g stroke="#4874CB" stroke-width="4"><path d="M310 351 H377"/><path d="M310 405 H377"/></g>
  <text x="330" y="476" text-anchor="middle" font-size="31" font-weight="600" fill="#17345C">先公布奖励策略</text>
  <rect x="128" y="500" width="404" height="69" rx="14" fill="white" stroke="#EE822F" stroke-width="2"/>
  <text x="330" y="545" text-anchor="middle" font-size="29" fill="#EE822F">单位处理器频率奖励 p</text>
  <text x="330" y="609" text-anchor="middle" font-size="26" fill="#17345C">在预算约束下</text>
  <text x="330" y="648" text-anchor="middle" font-size="28" font-weight="600" fill="#17345C">减少本轮完成时间</text>

  <path d="M570 395 H815" fill="none" stroke="#EE822F" stroke-width="5" marker-end="url(#orange-arrow)"/>
  <text x="699" y="351" text-anchor="middle" font-size="27" font-weight="600" fill="#EE822F">公布 p</text>
  <text x="699" y="441" text-anchor="middle" font-size="25" fill="#17345C">观察后再响应</text>
  <text x="699" y="479" text-anchor="middle" font-size="24" fill="#4874CB">先后决策，非同时</text>

  <rect x="862" y="323" width="190" height="214" rx="18" fill="white"/>
  <rect x="1075" y="323" width="190" height="214" rx="18" fill="white"/>
  <rect x="1288" y="323" width="190" height="214" rx="18" fill="white"/>
  <text x="957" y="361" text-anchor="middle" font-size="27" font-weight="600" fill="#17345C">客户端甲</text>
  <text x="1170" y="361" text-anchor="middle" font-size="27" font-weight="600" fill="#17345C">客户端乙</text>
  <text x="1383" y="361" text-anchor="middle" font-size="27" font-weight="600" fill="#17345C">客户端丙</text>
  <use href="#cpu" transform="translate(957 416)"/>
  <use href="#cpu" transform="translate(1170 416)"/>
  <use href="#cpu" transform="translate(1383 416)"/>
  <g stroke="#30C0B4" stroke-width="5" stroke-linecap="round"><path d="M899 479 H1015"/><path d="M1112 479 H1228"/><path d="M1325 479 H1441"/></g>
  <g fill="white" stroke="#30C0B4" stroke-width="4"><circle cx="990" cy="479" r="8"/><circle cx="1144" cy="479" r="8"/><circle cx="1381" cy="479" r="8"/></g>
  <g font-size="24" fill="#17345C" text-anchor="middle"><text x="957" y="519">自选频率 δ甲</text><text x="1170" y="519">自选频率 δ乙</text><text x="1383" y="519">自选频率 δ丙</text></g>
  <text x="1170" y="580" text-anchor="middle" font-size="27" font-weight="600" fill="#17345C">各自最大化净收益</text>
  <text x="1170" y="622" text-anchor="middle" font-size="27" fill="#17345C">奖励 − 计算成本 − 通信成本</text>
  <text x="1170" y="654" text-anchor="middle" font-size="23" fill="#4874CB">给定 p，结合自身资源与成本作出响应</text>

  <path d="M1170 672 V701" stroke="#4874CB" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <rect x="858" y="713" width="650" height="76" rx="18" fill="#F1F5FC" stroke="#4874CB" stroke-width="2"/>
  <path d="M890 745 L901 756 L922 731" fill="none" stroke="#30C0B4" stroke-width="4"/>
  <text x="946" y="760" font-size="29" font-weight="600" fill="#17345C">按所选频率本地训练 · 返回模型更新</text>
  <path d="M858 751 H342 Q330 751 330 737 V684" fill="none" stroke="#4874CB" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <text x="601" y="733" text-anchor="middle" font-size="25" fill="#4874CB">训练更新返回服务器</text>

  <rect x="90" y="819" width="1418" height="61" rx="15" fill="#F1F5FC"/>
  <text x="799" y="859" text-anchor="middle" font-size="27" fill="#17345C">决策顺序：服务器公布 p → 客户端各自选择 δ → 本地训练与更新反馈</text>
</svg>
