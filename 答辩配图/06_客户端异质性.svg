    <rect x="596" y="600" width="219" height="51" rx="7" fill="#4874CB"/>
    <rect x="815" y="600" width="194" height="51" rx="7" fill="#30C0B4"/>
    <path d="M815 601 V650" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="1009" y="600" width="429" height="51" rx="7" fill="#F1F5FC" stroke="#8C9CB1" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="705" y="634" font-size="26" fill="#FFFFFF" text-anchor="middle">本地计算</text>
    <text x="912" y="634" font-size="25" text-anchor="middle">模型上传</text>
    <text x="1223" y="634" font-size="25" text-anchor="middle" fill="#61728A">等待同步</text>
    <text x="1009" y="679" font-size="22" text-anchor="middle" fill="#61728A">完成</text>

    <path d="M596 710 H1438 M596 705 V715 M1438 705 V715" stroke="#8C9CB1" stroke-width="2" fill="none"/>
    <text x="596" y="747" font-size="22" fill="#61728A">轮次开始</text>
    <text x="1017" y="747" font-size="22" text-anchor="middle" fill="#61728A">时间 →（条长为概念示意，无数值刻度）</text>

    <rect x="64" y="776" width="1472" height="89" rx="18" fill="#17345C"/>
    <text x="91" y="831" font-size="28" font-weight="600" fill="#FFFFFF">训练时间 = 计算时间 + 上传时间</text>
